services:
  backend:
    build: .
    command: python -m uvicorn app.main:app --app-dir /app/backend --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
  frontend:
    build: .
    working_dir: /app
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      RESUMEIQ_API: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
